<!--
  B 站视频卡片模板（art-template 语法，由 renderer-puppeteer 等渲染器编译）

  约定：
  - 截图对象是 `#card`，故外层不要留边距，尺寸由它自己的 width 决定；
  - 不引任何外部字体与脚本：渲染器常常跑在离线机器上，缺一个 CDN 就是一张白图；
  - `{{ }}` 默认转义，标题里的 < > & 不会破坏结构。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #f4f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        display: inline-block;
      }
      #card {
        width: 720px;
        padding: 18px;
        background: #ffffff;
        color: #18191c;
      }
      .cover {
        position: relative;
        width: 100%;
        height: 405px;
        border-radius: 10px;
        overflow: hidden;
        background: #e3e5e7;
      }
      .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .badge {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, .72);
        color: #fff;
        font-size: 13px;
        letter-spacing: .3px;
      }
      .body { padding: 14px 4px 2px; }
      .title {
        font-size: 23px;
        line-height: 1.45;
        font-weight: 700;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #61666d;
      }
      .avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #e3e5e7; }
      .dot { color: #c9ccd0; }
      .desc {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.6;
        color: #61666d;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .stats {
        margin-top: 16px;
        display: flex;
        gap: 26px;
        padding-top: 14px;
        border-top: 1px solid #f1f2f3;
      }
      .stat { display: flex; flex-direction: column; gap: 3px; }
      .stat .num { font-size: 17px; font-weight: 700; color: #18191c; }
      .stat .label { font-size: 12px; color: #9499a0; }
      .foot {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: #9499a0;
      }
      .foot .url { color: #00aeec; }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="cover">
        <img src="{{cover}}" alt="封面" />
        <span class="badge">{{duration}}</span>
      </div>

      <div class="body">
        <div class="title">{{title}}</div>

        <div class="meta">
          <img class="avatar" src="{{ownerFace}}" alt="" />
          <span>{{ownerName}}</span>
          <span class="dot">·</span>
          <span>{{tname}}</span>
          <span class="dot">·</span>
          <span>{{pubdate}}</span>
          {{if pages > 1}}<span class="dot">·</span><span>{{pages}}P</span>{{/if}}
        </div>

        <div class="desc">{{desc}}</div>

        <div class="stats">
          <div class="stat"><span class="num">{{view}}</span><span class="label">播放</span></div>
          <div class="stat"><span class="num">{{danmaku}}</span><span class="label">弹幕</span></div>
          <div class="stat"><span class="num">{{like}}</span><span class="label">点赞</span></div>
          <div class="stat"><span class="num">{{coin}}</span><span class="label">投币</span></div>
          <div class="stat"><span class="num">{{favorite}}</span><span class="label">收藏</span></div>
          <div class="stat"><span class="num">{{share}}</span><span class="label">分享</span></div>
          <div class="stat"><span class="num">{{reply}}</span><span class="label">评论</span></div>
        </div>

        <div class="foot">
          <span class="url">{{url}}</span>
          <span>{{bvid}}</span>
        </div>
      </div>
    </div>
  </body>
</html>
