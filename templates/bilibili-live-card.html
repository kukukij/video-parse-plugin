<!--
  B 站视频卡片（横向 · 浅色 iOS 玻璃）

  设计：
  - 横向构图：左边一整块封面，右边信息，和之前上下堆叠的卡片明显不同；
  - 封面用 `align-self: stretch` 跟着右侧内容走，形成近似海报的竖块；
  - 背景仍是封面模糊 + 白色薄雾，上面盖高透白玻璃；
  - 平台 logo 用评论图右上角那张官方粉色字标。

  约定：
  - 截图对象是 `#card`，宽 720；
  - 不引外部字体、图片与脚本。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #eef1f5;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC",
          "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        display: inline-block;
      }
      #card {
        position: relative;
        width: 720px;
        padding: 22px;
        background: #eef1f5;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(44px) saturate(140%) brightness(1.18);
        transform: scale(1.2);
      }
      #card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, .54), rgba(255, 255, 255, .74));
      }

      .glass {
        position: relative;
        z-index: 1;
        padding: 18px;
        border-radius: 26px;
        background: rgba(255, 255, 255, .58);
        border: 1px solid rgba(255, 255, 255, .92);
        box-shadow:
          0 20px 46px rgba(25, 30, 45, .16),
          inset 0 1px 0 rgba(255, 255, 255, .96);
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
      }
      .row { display: flex; gap: 20px; align-items: stretch; min-height: 300px; }

      .cover {
        position: relative;
        flex: none;
        align-self: center;
        width: 320px;
        aspect-ratio: 3 / 2;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, .5);
        box-shadow: 0 10px 24px rgba(25, 30, 45, .16);
      }
      .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .badge {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(0, 0, 0, .42);
        color: #fff;
        font-size: 10px;
        line-height: 14px;
        letter-spacing: .3px;
        backdrop-filter: blur(10px);
      }

      .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 24px;
        margin-bottom: 6px;
      }
      .kind { font-size: 10.5px; letter-spacing: .5px; color: #9aa0a8; }
      .logo { height: 24px; width: auto; display: block; }

      .title {
        font-size: 25px;
        line-height: 1.38;
        font-weight: 700;
        color: #0f1115;
        letter-spacing: .2px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta {
        margin-top: 7px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        line-height: 19px;
        color: #6b7078;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        background: rgba(255, 255, 255, .7);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, .95);
      }
      .meta .name { color: #22252b; font-weight: 600; }
      .dot { color: #c3c7ce; }

      .desc {
        margin-top: 7px;
        font-size: 13px;
        line-height: 1.6;
        color: #70757d;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .stats {
        margin-top: auto;
        display: flex;
        gap: 16px;
        padding-top: 9px;
        border-top: 1px solid rgba(15, 17, 21, .08);
      }
      .stat { display: flex; flex-direction: column; gap: 1px; }
      .stat .num {
        font-size: 19px;
        line-height: 25px;
        font-weight: 700;
        color: #0f1115;
        font-variant-numeric: tabular-nums;
      }
      .stat .label { font-size: 10.5px; line-height: 13px; color: #9aa0a8; }

      .foot {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 10.5px;
        line-height: 15px;
        color: #9aa0a8;
      }
      .foot .url {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #00aeec;
      }
      .foot .bvid {
        flex: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: .5px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <img class="bg" src="{{cover}}" alt="" />

      <div class="glass">
        <div class="row">
          <div class="cover">
            <img src="{{cover}}" alt="封面" />
            <span class="badge">{{status}}</span>
          </div>

          <div class="info">
            <div class="top">
              <span class="kind">直播</span>

              <span>{{status}}</span>
              {{if area}}<span class="dot">·</span><span>{{area}}</span>{{/if}}

            {{if desc}}<div class="desc">{{desc}}</div>{{/if}}

            <div class="stats">
              <div class="stat"><span class="num">{{popularity}}</span><span class="label">人气</span></div>
              {{if watched}}<div class="stat"><span class="num">{{watched}}</span><span class="label">看过</span></div>{{/if}}
              {{if likes}}<div class="stat"><span class="num">{{likes}}</span><span class="label">点赞</span></div>{{/if}}
              {{if attention}}<div class="stat"><span class="num">{{attention}}</span><span class="label">关注</span></div>{{/if}}
              {{if guards}}<div class="stat"><span class="num">{{guards}}</span><span class="label">舰长</span></div>{{/if}}
            </div>

            <div class="foot">
              <span class="url">{{url}}</span>
              <span class="bvid">房间 {{roomId}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
